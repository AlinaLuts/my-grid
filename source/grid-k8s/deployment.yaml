apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-web-deployment
  labels:
    app: grid-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grid-web
  template:
    metadata:
      labels:
        app: grid-web
    spec:
      containers:
        - name: grid-service
          image: grid-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2